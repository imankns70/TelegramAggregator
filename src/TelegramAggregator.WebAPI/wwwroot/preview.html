<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیش‌نمایش زنده @FOOTBALFORI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap');

        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            line-height: 1.8;
        }

        .container {
            max-width: 480px;
            margin: 40px auto;
            background: #111;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }

        .post {
            background: #1a1a1a;
            padding: 22px;
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin: 0 0 16px 0;
            line-height: 1.5;
        }

        .text {
            font-size: 15px;
            color: #ddd;
            white-space: pre-line;
        }

        .footer {
            margin-top: 24px;
            font-weight: 700;
            color: #00d4ff;
            font-size: 16px;
        }

        .button {
            display: block;
            margin: 20px auto 0;
            padding: 14px 32px;
            background: linear-gradient(90deg, #e74c3c, #c0392b);
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 6px 15px rgba(231,76,60,0.4);
            max-width: 240px;
        }

            .button:hover {
                background: #c0392b;
                transform: translateY(-2px);
            }

        .refresh {
            text-align: center;
            margin: 30px 0;
            color: #666;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #0f0;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="post" id="preview">
            <div class="loading">در حال دریافت آخرین خبر...</div>
        </div>
        <div class="refresh">رفرش خودکار هر ۸ ثانیه</div>
    </div>

    <script>
        async function loadPreview() {
            try {
                const res = await fetch('/api/debug/latest-preview');
                const item = await res.json();

                document.getElementById('preview').innerHTML = `
                        <div class="title">${item.title || 'بدون عنوان'}</div>
                        <div class="text">${(item.previewHtml || '').replace(/<br>/g, '<br>')}</div>
                        <div class="footer">@FOOTBALFORI #iman</div>
                        ${item.link ? `<a href="${item.link}" target="_blank" class="button">مشاهده خبر کامل</a>` : ''}
                    `;
            } catch (e) {
                document.getElementById('preview').innerHTML = '<div class="loading" style="color:#f44;">خطا در دریافت خبر</div>';
            }
        }

        loadPreview();
        setInterval(loadPreview, 8000);
    </script>
</body>
</html>
