<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <title>دیباگ زنده ربات فوتبال فوری — نسخه هوشمند</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        :root {
            --green: #0f9;
            --red: #f66;
            --yellow: #ff0;
            --cyan: #0cf;
            --gold: #ffd700;
            --dark: #000;
            --box: #0a0a0a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, sans-serif;
            background: var(--dark);
            color: var(--green);
            padding: 15px;
            line-height: 1.7;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            font-size: clamp(26px,7vw,38px);
            text-shadow: 0 0 25px var(--cyan);
            margin-bottom: 20px;
            background: linear-gradient(90deg, #0f9, #0cf, #ff0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .box {
            background: var(--box);
            border: 1px solid var(--green);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0,255,150,0.2);
        }

        h2 {
            margin-bottom: 12px;
            text-shadow: 0 0 15px;
        }

            h2.queues-title {
                color: var(--green);
            }

            h2.next-title {
                color: var(--gold);
                text-shadow: 0 0 25px var(--gold);
                font-size: 1.4em;
            }

            h2.published-title {
                color: var(--cyan);
            }

            h2.logs-title {
                color: var(--yellow);
            }

        .scroll-queues {
            border: 2px solid var(--green);
            background: #001100;
        }

        .scroll-next {
            border: 3px solid var(--gold);
            background: #221100;
            box-shadow: 0 0 40px rgba(255,215,0,0.4);
            animation: pulse-next 2s infinite;
        }

        .scroll-published {
            border: 2px solid var(--cyan);
            background: #001111;
        }

        .scroll-logs {
            border: 2px solid var(--yellow);
            background: #111100;
        }

        @keyframes pulse-next {
            0%,100% {
                opacity: 0.9;
            }

            50% {
                opacity: 1;
                box-shadow: 0 0 60px #ffd700;
            }
        }

        .scroll-box {
            max-height: 480px;
            overflow-y: auto;
            border-radius: 12px;
            margin: 12px 0;
            padding: 10px;
        }

            .scroll-box::-webkit-scrollbar {
                width: 12px;
            }

            .scroll-box::-webkit-scrollbar-track {
                background: #000;
                border-radius: 10px;
            }

            .scroll-box::-webkit-scrollbar-thumb {
                background: linear-gradient(#0f9,#0cf,#ff0);
                border-radius: 10px;
                box-shadow: 0 0 20px #0f9;
            }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: clamp(12.5px,3.5vw,14.5px);
        }

        th, td {
            padding: 11px 8px;
            border-bottom: 1px dashed #003300;
            text-align: right;
        }

        th {
            background: #001a00;
            color: var(--green);
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tr:hover {
            background: #002200;
        }

        tr.best-item {
            background: #003300 !important;
            animation: glow-item 2s infinite;
        }

        @keyframes glow-item {
            0%,100% {
                box-shadow: 0 0 10px #0f9;
            }

            50% {
                box-shadow: 0 0 25px #0f9;
            }
        }

        .num {
            width: 45px;
            text-align: center;
            font-weight: bold;
            color: var(--green);
        }

        .score {
            font-weight: bold;
            text-align: center;
            width: 70px;
        }

        .score-high {
            color: #0f9;
        }

        .score-med {
            color: #ff0;
        }

        .score-low {
            color: #f66;
        }

        .status-sent {
            color: var(--cyan);
            font-weight: bold;
        }

        .link-cell a {
            color: #0cf;
            text-decoration: none;
            font-size: 18px;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(0,204,255,0.1);
        }

            .link-cell a:hover {
                color: #ff0;
                background: rgba(255,255,0,0.2);
                text-shadow: 0 0 10px #ff0;
            }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
            gap: 15px;
            margin: 15px 0;
        }

        .stat-box {
            background: #001a00;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--green);
        }

        .stat-num {
            font-size: 28px;
            font-weight: bold;
            display: block;
            margin: 8px 0;
        }

        .empty {
            text-align: center;
            padding: 40px;
            background: #001a00;
            border-radius: 12px;
            font-size: 19px;
            color: var(--green);
        }

        .refresh {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            animation: pulse 2s infinite;
            color: var(--green);
        }

        @keyframes pulse {
            0%,100% {
                opacity: 0.8;
            }

            50% {
                opacity: 1;
                text-shadow: 0 0 30px var(--green);
            }
        }

        @media (min-width:900px) {
            .grid {
                grid-template-columns: 1fr 440px;
            }
        }
    </style>
</head>
<body>
    <h1>دیباگ زنده ربات فوتبال فوری — نسخه هوشمند</h1>
    <div class="grid">
        <div class="box"><div id="main">در حال بارگذاری...</div></div>
        <div class="box">
            <h2>آمار لحظه‌ای و شفاف</h2>
            <div id="stats" class="stats-grid"></div>
            <div class="refresh">رفرش خودکار در <span id="countdown">10</span> ثانیه</div>
        </div>
    </div>

    <script>
        const e = t => t ? String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) : '';
        const nf = (num, fallback = "۰") => (num ?? 0).toLocaleString('fa-IR');
        const getScoreClass = s => s >= 90 ? 'score-high' : s >= 70 ? 'score-med' : 'score-low';

        const mainEl = document.getElementById('main');
        const statsEl = document.getElementById('stats');
        const countdownEl = document.getElementById('countdown');
        let countdown = 10;

        function startCountdown() {
            countdown = 10;
            countdownEl.textContent = countdown;
            const id = setInterval(() => {
                countdown--;
                countdownEl.textContent = countdown;
                if (countdown <= 0) { clearInterval(id); load(); }
            }, 1000);
        }

        function cleanSourceName(name) {
            if (!name) return "نامشخص";
            return name
                .replace(/؛ آخرین اخبار ورزشی.*/g, '')
                .replace(/\| آخرین اخبار ورزشی/g, '')
                .replace(/ - آخرین اخبار ورزشی/g, '')
                .replace(/ - Varzesh3/g, '')
                .replace(/ - Khabarvarzeshi/g, '')
                .replace(/ \| Varzesh 3/g, '')
                .replace(/[\|؛-].*$/, '')
                .trim()
                .replace(/\s+/g, ' ');
        }

        // لیست ثابت منابع (همیشه اینا نمایش داده بشن)
        const ALL_SOURCES = ["ورزش ۳", "طرفداری", "خبر ورزشی", "فوتبال ۳۶۰"];

        async function load() {
            try {
                const [feedRes, statsRes] = await Promise.all([
                    fetch('/api/debug/feed'),
                    fetch('/api/debug/stats')
                ]);
                if (!feedRes.ok || !statsRes.ok) throw new Error("API Error");
                const data = await feedRes.json();
                const s = await statsRes.json();

                // خبر بعدی که ارسال میشه
                const nextBest = data.nextBestItem;
                const nextHtml = nextBest ? `
                        <div class="box" style="border:3px solid var(--gold); background:#221100;">
                            <h2 class="next-title">خبر بعدی که ارسال میشه!</h2>
                            <div class="scroll-box scroll-next">
                                <table>
                                    <tr><th>منبع</th><th>عنوان</th><th>امتیاز</th><th>دلیل</th></tr>
                                    <tr class="best-item">
                                        <td><strong style="color:#0cf;">${e(cleanSourceName(nextBest.source))}</strong></td>
                                        <td style="color:#ff0;font-weight:bold;">${e(nextBest.title.substring(0, 80))}...</td>
                                        <td class="score ${getScoreClass(nextBest.score)}" style="font-size:24px;">${nextBest.score}</td>
                                        <td style="color:#0f9;">${nextBest.reason || 'بالاترین امتیاز'}</td>
                                    </tr>
                                </table>
                            </div>
                        </div>` : '<div class="empty">هیچ خبری در صف نیست</div>';

                // صف‌های انتشار — همیشه همه منابع نمایش داده بشن
                const queuesHtml = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;">' +
                    ALL_SOURCES.map(sourceName => {
                        const items = data.queues?.[sourceName] || [];
                        const count = items.length;
                        const color = count > 15 ? '#f66' : count > 8 ? '#ff0' : '#0f9';

                        return `
                                <div class="box" style="border-color:${color};">
                                    <h2 class="queues-title">${e(sourceName)} <span style="color:#0f9;font-weight:bold;">${count} خبر</span></h2>
                                    <div class="scroll-box scroll-queues">
                                        ${count === 0
                                ? '<div class="empty">صف خالی — در انتظار خبر جدید</div>'
                                : `<table>
                                                <tr><th>#</th><th>عنوان</th><th>امتیاز</th><th>زمان</th></tr>
                                                ${items.map((item, i) => {
                                    const isBest = nextBest && item.uniqueKey === nextBest.uniqueKey;
                                    return `<tr ${isBest ? 'class="best-item"' : ''}>
                                                        <td class="num">${i + 1}</td>
                                                        <td title="${e(item.title)}">${e((item.title || "بدون عنوان").substring(0, 65))}...</td>
                                                        <td class="score ${getScoreClass(item.score || 0)}">${item.score || 0}</td>
                                                        <td>${item.pubDate || ''}</td>
                                                    </tr>`;
                                }).join('')}
                                            </table>`
                            }
                                    </div>
                                </div>`;
                    }).join('') + '</div>';

                // بقیه بخش‌ها (آخرین ارسال‌شده‌ها و پردازش‌شده‌ها) مثل قبل
                const publishedHtml = data.publishedItems?.length
                    ? `<div class="scroll-box scroll-published">
                            <table>
                                <tr><th>#</th><th>منبع</th><th>عنوان</th><th>امتیاز</th><th>زمان ارسال</th></tr>
                                ${data.publishedItems.map((i, idx) => `
                                    <tr>
                                        <td class="num">${idx + 1}</td>
                                        <td><span class="status-sent">${e(cleanSourceName(i.source))}</span></td>
                                        <td title="${e(i.title)}">${e((i.title || "بدون عنوان").substring(0, 70))}...</td>
                                        <td class="score ${getScoreClass(i.score || 0)}">${i.score || 0}</td>
                                        <td>${i.sentAt || ''}</td>
                                    </tr>`).join('')}
                            </table>
                           </div>`
                    : '<div class="empty">هنوز خبری ارسال نشده</div>';

                const recentHtml = data.recentProcessed?.length
                    ? `<div class="scroll-box scroll-logs">
                            <table>
                                <tr><th>#</th><th>منبع</th><th>عنوان</th><th>وضعیت</th><th>دلیل</th><th>زمان</th><th>لینک خبر</th></tr>
                                ${data.recentProcessed.map((i, idx) => {
                        const source = cleanSourceName(i.source) || 'نامشخص';
                        const title = i.title || 'بدون عنوان';
                        const link = i.link || null;
                        const statusText = i.status || 'نامشخص';
                        const reasonText = i.reason || 'در حال بررسی';
                        let statusColor = 'status-rejected';
                        if (statusText === 'ارسال شد') statusColor = 'status-sent';
                        else if (statusText.includes('در صف')) statusColor = 'status-queued';
                        else if (statusText === 'قبول شده') statusColor = 'status-accepted';
                        const linkHtml = link ? `<a href="${e(link)}" target="_blank" title="باز کردن خبر">Link</a>` : '—';
                        return `
                                        <tr>
                                            <td class="num">${idx + 1}</td>
                                            <td>${e(source)}</td>
                                            <td title="${e(title)}">${e(title.substring(0, 55))}...</td>
                                            <td class="${statusColor}">${statusText}</td>
                                            <td style="font-size:11px;color:#ff9;" title="${e(reasonText)}">
                                                ${e(reasonText.substring(0, 45))}${reasonText.length > 45 ? '...' : ''}
                                            </td>
                                            <td>${i.time || ''}</td>
                                            <td class="link-cell">${linkHtml}</td>
                                        </tr>`;
                    }).join('')}
                            </table>
                           </div>`
                    : '<div class="empty">هنوز خبری پردازش نشده</div>';

                mainEl.innerHTML = `
                        ${nextHtml}
                        <h2 class="queues-title">صف‌های انتشار (با امتیاز هوشمند)</h2>
                        ${queuesHtml}
                        <h2 class="published-title">آخرین ارسال‌شده‌ها</h2>
                        ${publishedHtml}
                        <h2 class="logs-title">آخرین پردازش‌شده‌ها</h2>
                        ${recentHtml}
                    `;

                // آمار مثل قبل
                const color = s.dashboardStatusColor === 'red' ? '#f66' : s.dashboardStatusColor === 'yellow' ? '#ff0' : '#0f9';
                statsEl.innerHTML = `
                        <div class="stat-box"><span class="stat-num" style="color:#0f9;">${nf(s.acceptedCount)}</span>قبول شده</div>
                        <div class="stat-box"><span class="stat-num" style="color:#f66;">${nf(s.rejectedCount)}</span>رد شده</div>
                        <div class="stat-box"><span class="stat-num" style="color:#0cf;">${nf(s.publishedCount)}</span>ارسال شده</div>
                        <div class="stat-box"><span class="stat-num" style="color:#ff0;">${nf(s.inQueueCount)}</span>در صف</div>
                        <div class="stat-box"><span class="stat-num" style="color:#aaa;">${nf(s.totalProcessed)}</span>کل پردازش</div>
                        <div class="stat-box"><span class="stat-num" style="color:${color};">${nf(s.acceptanceRate)}%</span>درصد قبولی</div>
                    `;

                startCountdown();
            } catch (err) {
                console.error("خطا:", err);
                mainEl.innerHTML = '<div class="empty" style="color:#f66;">خطا در ارتباط — دوباره تلاش می‌کنم...</div>';
                startCountdown();
            }
        }
        load();
    </script>
</body>
</html>
