<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <title>دیباگ زنده ربات فوتبال فوری — نسخه هوشمند</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        :root {
            --green: #0f9;
            --red: #f66;
            --yellow: #ff0;
            --cyan: #0cf;
            --gold: #ffd700;
            --dark: #000;
            --box: #0a0a0a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, sans-serif;
            background: var(--dark);
            color: var(--green);
            padding: 15px;
            line-height: 1.7;
            min-height: 100vh;
        }

        .top-header {
            text-align: center;
            padding: 16px 12px;
            background: rgba(0,255,150,0.08);
            border: 2px solid var(--green);
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 0 40px rgba(0,255,150,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .main-title {
            font-size: clamp(24px, 6vw, 40px);
            font-weight: bold;
            background: linear-gradient(90deg,#0f9,#0cf,#ff0,#f0f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px var(--cyan);
        }

        .refresh-text {
            font-size: clamp(17px, 4vw, 22px);
            color: var(--gold);
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,100% {
                opacity: .9;
            }

            50% {
                opacity: 1;
                text-shadow: 0 0 35px var(--gold);
            }
        }

        @media (min-width: 768px) {
            .top-header {
                flex-direction: row;
                justify-content: center;
                gap: 40px;
            }
        }

        .main-container {
            max-width: 1900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .full-width-block {
            background: var(--box);
            border: 1px solid var(--green);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0,255,150,0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(6,1fr);
            gap: 15px;
            margin: 15px 0;
        }

        .stat-box {
            background: #001a00;
            padding: 14px 8px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--green);
        }

        .stat-num {
            font-size: 32px;
            font-weight: bold;
            display: block;
            margin: 6px 0;
        }

        .queues-grid {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 18px;
        }

        .queue-box {
            background: var(--box);
            border: 1px solid var(--green);
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 0 25px rgba(0,255,150,0.15);
        }

        .queue-title {
            color: var(--green);
            text-shadow: 0 0 15px var(--green);
            margin-bottom: 12px;
            font-size: 1.2em;
        }

        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        h2 {
            margin-bottom: 14px;
            text-shadow: 0 0 15px;
            font-size: 1.3em;
        }

            h2.published-title {
                color: var(--cyan);
            }

            h2.logs-title {
                color: var(--yellow);
            }

        .scroll-box {
            max-height: 520px;
            overflow-y: auto;
            border-radius: 12px;
            margin: 12px 0;
            padding: 10px;
        }

        .scroll-published {
            border: 2px solid var(--cyan);
            background: #001111;
        }

        .scroll-logs {
            border: 2px solid var(--yellow);
            background: #111100;
        }

        .scroll-queues {
            border: 2px solid var(--green);
            background: #001a00;
        }

        .scroll-box::-webkit-scrollbar {
            width: 12px;
        }

        .scroll-box::-webkit-scrollbar-track {
            background: #000;
            border-radius: 10px;
        }

        .scroll-box::-webkit-scrollbar-thumb {
            background: linear-gradient(#0f9,#0cf,#ff0);
            border-radius: 10px;
            box-shadow: 0 0 20px #0f9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: clamp(13px,3.5vw,15px);
        }

        th, td {
            padding: 11px 8px;
            border-bottom: 1px dashed #003300;
            text-align: right;
        }

        th {
            background: #001a00;
            color: var(--green);
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tr:hover {
            background: #002200;
        }

        .num {
            width: 45px;
            text-align: center;
            font-weight: bold;
            color: var(--green);
        }

        .score {
            font-weight: bold;
            text-align: center;
            width: 70px;
        }

        .score-high {
            color: #0f9;
        }

        .score-med {
            color: #ff0;
        }

        .score-low {
            color: #f66;
        }

        .link-cell a {
            color: #0cf;
            text-decoration: none;
            font-size: 18px;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(0,204,255,0.1);
        }

            .link-cell a:hover {
                color: #ff0;
                background: rgba(255,255,0,0.2);
                text-shadow: 0 0 10px #ff0;
            }

        .empty {
            text-align: center;
            padding: 50px 20px !important;
            font-size: 20px;
            color: var(--green);
            font-weight: bold;
            opacity: 0.8;
        }

        /* === رنگ‌بندی کامل وضعیت‌ها === */
        .status-3 {
            color: var(--yellow);
            font-weight: bold;
            text-align: center;
        }

        .status-1 {
            color: var(--green);
            font-weight: bold;
            text-align: center;
        }

        .status-2 {
            color: var(--red);
            font-weight: bold;
            text-align: center;
        }

        .status-5 {
            color: #aaa;
            font-weight: bold;
            font-style: italic;
            text-align: center;
        }

        .status-4 {
            color: var(--cyan);
            font-weight: bold;
            text-align: center;
        }

     

        @media (max-width:1400px) {
            .stats-grid {
                grid-template-columns: repeat(3,1fr);
            }

            .queues-grid {
                grid-template-columns: repeat(2,1fr);
            }
        }

        @media (max-width:900px) {
            .stats-grid {
                grid-template-columns: repeat(2,1fr);
            }

            .queues-grid {
                grid-template-columns: 1fr 1fr;
            }

            .bottom-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width:600px) {
            .stats-grid, .queues-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="top-header">
        <span class="main-title">دیباگ زنده ربات فوتبال فوری — نسخه هوشمند</span>
        <span class="refresh-text">رفرش خودکار در <span id="countdown">10</span> ثانیه</span>
    </div>
    <div class="main-container">
        <div class="full-width-block">
            <h2>آمار لحظه‌ای و شفاف</h2>
            <div id="stats" class="stats-grid"></div>
        </div>
        <div class="full-width-block">
            <div id="queues" class="queues-grid"></div>
        </div>
        <div class="full-width-block">
            <div class="bottom-grid">
                <div class="queue-box">
                    <h2 class="published-title">آخرین ارسال‌شده‌ها</h2>
                    <div id="published" class="scroll-box scroll-published"></div>
                </div>
                <div class="queue-box">
                    <h2 class="logs-title">آخرین پردازش‌شده‌ها</h2>
                    <div id="logs" class="scroll-box scroll-logs"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const e = t => t ? String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) : '';
        const nf = (num, fallback = "۰") => (num ?? 0).toLocaleString('fa-IR');
        const getScoreClass = s => s >= 90 ? 'score-high' : s >= 70 ? 'score-med' : 'score-low';

        const ALL_SOURCES = [
            "ورزش سه | آخرین اخبار ورزشی",
            "طرفداری",
            "خبرورزشی؛ آخرین اخبار ورزشی ایران و جهان",
            "فوتبال 360"
        ];

        var sportSourceNames = {
            "ورزش سه | آخرین اخبار ورزشی": "ورزش سه",
            "طرفداری": "طرفداری",
            "خبرورزشی؛ آخرین اخبار ورزشی ایران و جهان": "خبرورزشی",
            "فوتبال 360": "فوتبال 360"
        }
        const statsEl = document.getElementById('stats');
        const queuesEl = document.getElementById('queues');
        const publishedEl = document.getElementById('published');
        const logsEl = document.getElementById('logs');
        const countdownEl = document.getElementById('countdown');
        let countdown = 10;

        function startCountdown() {
            countdown = 10;
            countdownEl.textContent = countdown;
            const id = setInterval(() => {
                countdown--;
                countdownEl.textContent = countdown;
                if (countdown <= 0) {
                    clearInterval(id);
                    load();
                }
            }, 1000);
        }
       
        async function load() {
            try {
                const response = await fetch('/api/Dashboard/feed');
                if (!response.ok) throw new Error("API Error");
                const d = await response.json();

                const color = d.statusColor === 'red' ? '#f66' : d.statusColor === 'yellow' ? '#ff0' : '#0f9';
                statsEl.innerHTML = `
                        <div class="stat-box"><span class="stat-num" style="color:#0f9;">${nf(d.acceptedCount)}</span>قبول شده</div>
                        <div class="stat-box"><span class="stat-num" style="color:#f66;">${nf(d.rejectedCount)}</span>رد شده</div>
                        <div class="stat-box"><span class="stat-num" style="color:#0cf;">${nf(d.publishedCount)}</span>ارسال شده</div>
                        <div class="stat-box"><span class="stat-num" style="color:#ff0;">${nf(d.inQueueCount)}</span>در صف</div>
                        <div class="stat-box"><span class="stat-num" style="color:#aaa;">${nf(d.totalProcessed)}</span>کل پردازش</div>
                        <div class="stat-box"><span class="stat-num" style="color:${color};">${nf(d.acceptanceRate)}%</span>درصد قبولی</div>
                    `;

                queuesEl.innerHTML = ALL_SOURCES.map(sourceName => {
                    debugger
                    const items = d.queues[sourceName] || [];
                    const count = items.length;
                    const borderColor = count > 15 ? '#f66' : count > 8 ? '#ff0' : '#0f9';

                    sourceName = sportSourceNames[sourceName];
                    return `
                            <div class="queue-box" style="border-color:${borderColor};">
                                <h2 class="queue-title">${e(sourceName)} <span style="color:#0f9;font-weight:bold;">تعداد ${count} خبر</span></h2>
                                <div class="scroll-box scroll-queues">
                                    <table>
                                        <thead>
                                            <tr><th>#</th><th>عنوان</th><th>امتیاز</th><th>زمان</th></tr>
                                        </thead>
                                        <tbody>
                                            ${count === 0
                            ? `<tr><td colspan="4" class="empty">صف خالی</td></tr>`
                            : items.map((item, i) => `
                                                    <tr>
                                                        <td class="num">${i + 1}</td>
                                                        <td title="${e(item.title)}">${e(item.title?.substring(0, 65) || "بدون عنوان")}...</td>
                                                        <td class="score ${getScoreClass(item.score || 0)}">${item.score || 0}</td>
                                                        <td>${item.pubDate || ''}</td>
                                                    </tr>`
                            ).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>`;
                }).join('');

                publishedEl.innerHTML = `
                        <table>
                            <thead>
                                <tr><th>#</th><th>منبع</th><th>عنوان</th><th>امتیاز</th><th>زمان ارسال</th></tr>
                            </thead>
                            <tbody>
                                ${d.publishedItems?.length
                        ? d.publishedItems.map((i, idx) => `
                                        <tr>
                                            <td class="num">${idx + 1}</td>
                                            <td><span class="status-sent">${e(i.source)}</span></td>
                                            <td title="${e(i.title)}">${e(i.title?.substring(0, 70) || "بدون عنوان")}...</td>
                                            <td class="score ${getScoreClass(i.score || 0)}">${i.score || 0}</td>
                                            <td>${i.sentAt || ''}</td>
                                        </tr>`
                        ).join('')
                        : `<tr><td colspan="5" class="empty">هنوز خبری ارسال نشده</td></tr>`
                    }
                            </tbody>
                        </table>`;

                logsEl.innerHTML = `
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>منبع</th>
                                    <th>عنوان</th>
                                    <th>وضعیت</th>
                                    <th>دلیل</th>
                                    <th>زمان</th>
                                    <th>لینک</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${d.recentProcessed?.length
                    ? d.recentProcessed.map((i, idx) => {
                       
                        const statusClass = `status-${i.statusId}`

                            const reasonCell = i.reason && i.reason.trim()
                                ? `<td title="${e(i.reason)}">${e(i.reason.substring(0, 40))}...</td>`
                                : `<td></td>`;

                            return `
                                            <tr>
                                                <td class="num">${idx + 1}</td>
                                                <td>${e(i.source)}</td>
                                                <td title="${e(i.title)}">${e(i.title?.substring(0, 55) || "بدون عنوان")}...</td>
                                                <td class="${statusClass}">${e(i.status) || '—'}</td>
                                                ${reasonCell}
                                                <td>${i.insertTime || ''}</td>
                                                <td class="link-cell">${i.link ? `<a href="${e(i.link)}" target="_blank">Link</a>` : '—'}</td>
                                            </tr>`;
                        }).join('')
                        : `<tr><td colspan="7" class="empty">هنوز خبری پردازش نشده</td></tr>`
                    }
                            </tbody>
                        </table>`;

                startCountdown();
            } catch (err) {
                console.error("خطا:", err);
                startCountdown();
            }
        }

        load();
    </script>
</body>
</html>
