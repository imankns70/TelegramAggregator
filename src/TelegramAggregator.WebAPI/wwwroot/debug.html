<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <title>دیباگ زنده ربات فوتبال فوری — کنترل مطلق</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://v1.fontapi.ir/css/Estedad" rel="stylesheet">
    <style>
        :root {
            --green: #0f9;
            --red: #f66;
            --yellow: #ff0;
            --blue: #0cf;
            --dark: #000;
            --box: #0a0a0a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Estedad',sans-serif;
            background: var(--dark);
            color: var(--green);
            padding: 15px;
            line-height: 1.7;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            font-size: clamp(24px,6vw,34px);
            text-shadow: 0 0 20px var(--green);
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .box {
            background: var(--box);
            border: 1px solid var(--green);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0,255,150,0.2);
        }

        h2 {
            color: var(--green);
            text-align: center;
            margin: 15px 0;
            text-shadow: 0 0 10px var(--green);
            font-size: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: clamp(12px,3.5vw,14.5px);
            margin: 12px 0;
        }

        th, td {
            padding: 10px 8px;
            border-bottom: 1px solid #003300;
            text-align: right;
        }

        th {
            background: #001a00;
            color: var(--green);
            font-weight: bold;
        }

        tr:hover {
            background: #001a00;
        }

        .num {
            width: 40px;
            text-align: center;
            font-weight: bold;
            color: var(--green);
        }

        .status-accepted {
            color: #0f9;
            font-weight: bold;
        }

        .status-rejected {
            color: #f66;
            font-weight: bold;
        }

        .status-sent {
            color: #0cf;
            font-weight: bold;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
            gap: 15px;
            margin: 15px 0;
        }

        .stat-box {
            background: #001a00;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--green);
        }

        .stat-num {
            font-size: 28px;
            font-weight: bold;
            display: block;
            margin: 8px 0;
        }

        .empty {
            text-align: center;
            padding: 30px;
            background: #001a00;
            border-radius: 12px;
            font-size: 18px;
            color: var(--green);
        }

        .refresh {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            animation: pulse 2s infinite;
            color: var(--green);
        }

        .queue-details {
            grid-column: 1/-1;
            padding: 12px;
            background: #001a00;
            border-radius: 10px;
            font-size: 15px;
            color: #0cf;
            text-align: center;
        }

        .extra-info {
            grid-column: 1/-1;
            font-size: 14px;
            color: #aaa;
            text-align: center;
            margin-top: 8px;
        }

        @keyframes pulse {
            0%,100% {
                opacity: 0.8;
            }

            50% {
                opacity: 1;
                text-shadow: 0 0 30px var(--green);
            }
        }

        @media (min-width:900px) {
            .grid {
                grid-template-columns: 1fr 440px;
            }
        }
    </style>
</head>
<body>
    <h1>دیباگ زنده ربات فوتبال فوری — کنترل مطلق</h1>
    <div class="grid">
        <div class="box">
            <div id="main">در حال بارگذاری...</div>
        </div>
        <div class="box">
            <h2>آمار لحظه‌ای و شفاف</h2>
            <div id="stats" class="stats-grid"></div>
            <div class="refresh">رفرش خودکار در <span id="countdown">10</span> ثانیه</div>
        </div>
    </div>

    <script>
        // ابزارهای ایمن — هیچوقت خطا نمی‌گیره!
        const e = t => t ? String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) : '';
        const n = (num, fallback = 0) => (num === undefined || num === null || isNaN(num)) ? fallback : Number(num);
        const nf = (num, fallback = "۰") => n(num, 0).toLocaleString('fa-IR');

        const mainEl = document.getElementById('main');
        const statsEl = document.getElementById('stats');
        const countdownEl = document.getElementById('countdown');
        let countdown = 10;

        function startCountdown() {
            countdown = 10;
            countdownEl.textContent = countdown;
            const id = setInterval(() => {
                countdown--;
                countdownEl.textContent = countdown;
                if (countdown <= 0) { clearInterval(id); load(); }
            }, 1000);
        }

        async function load() {
            try {
                const [feedRes, statsRes] = await Promise.all([
                    fetch('/api/debug/feed'),
                    fetch('/api/debug/stats')
                ]);

                if (!feedRes.ok || !statsRes.ok) throw new Error("API Error");

                const data = await feedRes.json();
                const stats = await statsRes.json();

                // بک‌اند با camelCase می‌فرسته → دقیقاً از همین استفاده می‌کنیم
                const s = stats;

                // صف‌های انتشار
                let html = `
                        <h2>صف‌های انتشار (در حال انتظار)</h2>
                        ${Object.keys(data.queues || {}).length === 0
                        ? '<div class="empty">همه صف‌ها خالی — عالی!</div>'
                        : '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px;">' +
                        Object.entries(data.queues).map(([source, items]) => {
                            const count = items.length;
                            const color = count > 15 ? '#f66' : count > 8 ? '#ff0' : '#0f9';
                            return `
                                    <div class="box" style="border-color:${color};box-shadow:0 0 20px ${color}40;">
                                        <h2 style="color:${color}">${e(source)} — ${count} خبر</h2>
                                        <table>
                                            <tr><th>#</th><th>عنوان</th><th>زمان</th></tr>
                                            ${items.slice(0, 10).map((item, i) => `
                                                <tr>
                                                    <td class="num">${i + 1}</td>
                                                    <td title="${e(item.title)}">${e((item.title || "").substring(0, 65))}...</td>
                                                    <td>${item.pubDate || ''}</td>
                                                </tr>
                                            `).join('')}
                                            ${count > 10 ? `<tr><td colspan="3" style="color:#aaa;text-align:center;">... و ${count - 10} خبر دیگر</td></tr>` : ''}
                                        </table>
                                    </div>`;
                        }).join('') + '</div>'
                    }

                        <h2>آخرین ارسال‌شده‌ها</h2>
                        ${data.publishedItems?.length
                        ? `<table><tr><th>#</th><th>منبع</th><th>عنوان</th><th>زمان</th></tr>
                                ${data.publishedItems.slice(0, 20).map((i, idx) => `
                                    <tr>
                                        <td class="num">${idx + 1}</td>
                                        <td><span class="status-sent">${e(i.source)}</span></td>
                                        <td>${e((i.title || "").substring(0, 70))}...</td>
                                        <td>${i.sentAt || ''}</td>
                                    </tr>
                                `).join('')}
                               </table>`
                        : '<div class="empty">هنوز خبری ارسال نشده</div>'
                    }

                        <h2>آخرین پردازش‌شده‌ها</h2>
                        ${data.recentProcessed?.length
                        ? `<table><tr><th>#</th><th>منبع</th><th>عنوان</th><th>وضعیت</th><th>زمان</th></tr>
                                ${data.recentProcessed.slice(0, 25).map((i, idx) => `
                                    <tr>
                                        <td class="num">${idx + 1}</td>
                                        <td>${e(i.source)}</td>
                                        <td title="${e(i.title)}">${e((i.title || "").substring(0, 60))}...</td>
                                        <td class="${i.status === 'قبول' ? 'status-accepted' : 'status-rejected'}">${i.status || '—'}</td>
                                        <td>${i.time || ''}</td>
                                    </tr>
                                `).join('')}
                               </table>`
                        : '<div class="empty">هنوز خبری پردازش نشده</div>'
                    }
                    `;

                mainEl.innerHTML = html;

                // آمار لحظه‌ای — ۱۰۰٪ دقیق و بدون خطا (camelCase)
                const color = s.dashboardStatusColor === 'red' ? '#f66' :
                    s.dashboardStatusColor === 'yellow' ? '#ff0' : '#0f9';

                statsEl.innerHTML = `
                        <div class="stat-box"><span class="stat-num" style="color:#0f9;">${nf(s.acceptedCount)}</span>قبول شده</div>
                        <div class="stat-box"><span class="stat-num" style="color:#f66;">${nf(s.rejectedCount)}</span>رد شده</div>
                        <div class="stat-box"><span class="stat-num" style="color:#0cf;">${nf(s.publishedCount)}</span>ارسال شده</div>
                        <div class="stat-box"><span class="stat-num" style="color:#ff0;">${nf(s.inQueueCount)}</span>در صف</div>
                        <div class="stat-box"><span class="stat-num" style="color:#aaa;">${nf(s.totalProcessed)}</span>کل پردازش</div>
                        <div class="stat-box"><span class="stat-num" style="color:${color};">${nf(s.acceptanceRate)}%</span>درصد قبولی</div>

                        <div class="queue-details">${s.queueDetails || "همه صف‌ها خالی"}</div>
                        <div class="extra-info">
                            آخرین ساعت: ${nf(s.lastHour?.total)} خبر — ${nf(s.lastHour?.acceptanceRate)}% قبولی
                            ${s.today?.accepted > 0 ? ` | امروز: ${nf(s.today.accepted)} قبول` : ''}
                        </div>
                    `;

                startCountdown();
            } catch (err) {
                console.error("خطا در لود داشبورد:", err);
                mainEl.innerHTML = '<div class="empty" style="color:#f66;">خطا در ارتباط — دوباره تلاش می‌کنم...</div>';
                statsEl.innerHTML = '<div class="empty" style="color:#f66;">آمار در دسترس نیست</div>';
                startCountdown();
            }
        }

        load();
    </script>
</body>
</html>
