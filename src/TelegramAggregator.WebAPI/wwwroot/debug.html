<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <title>دیباگ زنده ربات فوتبال فوری</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        :root {
            --green: #0f9;
            --red: #f66;
            --yellow: #ff0;
            --cyan: #0cf;
            --dark: #000;
            --box: #0a0a0a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, sans-serif;
            background: var(--dark);
            color: var(--green);
            padding: 15px;
            line-height: 1.7;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            font-size: clamp(24px,6vw,34px);
            text-shadow: 0 0 20px var(--green);
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .box {
            background: var(--box);
            border: 1px solid var(--green);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0,255,150,0.2);
        }

        h2.queues-title {
            color: #0f9;
            text-shadow: 0 0 15px #0f9;
        }

        h2.published-title {
            color: #0cf;
            text-shadow: 0 0 15px #0cf;
        }

        h2.logs-title {
            color: #ff0;
            text-shadow: 0 0 15px #ff0;
        }

        .scroll-queues {
            border: 2px solid #0f9;
            background: #001100;
        }

        .scroll-published {
            border: 2px solid #0cf;
            background: #001111;
        }

        .scroll-logs {
            border: 2px solid #ff0;
            background: #111100;
        }

        .scroll-box {
            max-height: 480px;
            overflow-y: auto;
            border-radius: 12px;
            margin: 12px 0;
            padding: 10px;
        }

            .scroll-box::-webkit-scrollbar {
                width: 12px;
            }

            .scroll-box::-webkit-scrollbar-track {
                background: #000;
                border-radius: 10px;
            }

            .scroll-box::-webkit-scrollbar-thumb {
                background: linear-gradient(#0f9,#0cf,#ff0);
                border-radius: 10px;
                box-shadow: 0 0 20px #0f9;
            }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: clamp(12.5px,3.5vw,14.5px);
        }

        th, td {
            padding: 11px 8px;
            border-bottom: 1px dashed #003300;
            text-align: right;
        }

        th {
            background: #001a00;
            color: var(--green);
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tr:hover {
            background: #002200;
        }

        .num {
            width: 45px;
            text-align: center;
            font-weight: bold;
            color: var(--green);
        }

        .status-accepted {
            color: #0f9;
            font-weight: bold;
        }

        .status-rejected {
            color: #f66;
            font-weight: bold;
        }

        .status-sent {
            color: #0cf;
            font-weight: bold;
        }

        .status-queued {
            color: #ff0;
            font-weight: bold;
        }

        .link-cell {
            text-align: center;
            width: 80px;
            font-weight: bold;
        }

            .link-cell a {
                color: #0cf;
                text-decoration: none;
                font-size: 18px;
                padding: 4px 10px;
                border-radius: 6px;
                background: rgba(0,204,255,0.1);
                display: inline-block;
            }

                .link-cell a:hover {
                    color: #ff0;
                    background: rgba(255,255,0,0.2);
                    text-shadow: 0 0 10px #ff0;
                }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
            gap: 15px;
            margin: 15px 0;
        }

        .stat-box {
            background: #001a00;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--green);
        }

        .stat-num {
            font-size: 28px;
            font-weight: bold;
            display: block;
            margin: 8px 0;
        }

        .empty {
            text-align: center;
            padding: 35px;
            background: #001a00;
            border-radius: 12px;
            font-size: 18px;
            color: var(--green);
        }

        .refresh {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            animation: pulse 2s infinite;
            color: var(--green);
        }

        @keyframes pulse {
            0%,100% {
                opacity: 0.8;
            }

            50% {
                opacity: 1;
                text-shadow: 0 0 30px var(--green);
            }
        }

        @media (min-width:900px) {
            .grid {
                grid-template-columns: 1fr 440px;
            }
        }
    </style>
</head>
<body>
    <h1>دیباگ زنده ربات فوتبال فوری</h1>
    <div class="grid">
        <div class="box"><div id="main">در حال بارگذاری...</div></div>
        <div class="box">
            <h2>آمار لحظه‌ای و شفاف</h2>
            <div id="stats" class="stats-grid"></div>
            <div class="refresh">رفرش خودکار در <span id="countdown">10</span> ثانیه</div>
        </div>
    </div>

    <script>
        const e = t => t ? String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) : '';
        const nf = (num, fallback = "۰") => (num ?? 0).toLocaleString('fa-IR');
        const mainEl = document.getElementById('main');
        const statsEl = document.getElementById('stats');
        const countdownEl = document.getElementById('countdown');
        let countdown = 10;

        function startCountdown() {
            countdown = 10;
            countdownEl.textContent = countdown;
            const id = setInterval(() => {
                countdown--;
                countdownEl.textContent = countdown;
                if (countdown <= 0) { clearInterval(id); load(); }
            }, 1000);
        }

        function cleanSourceName(name) {
            if (!name) return "نامشخص";
            return name
                .replace(/؛ آخرین اخبار ورزشی.*/g, '')
                .replace(/\| آخرین اخبار ورزشی/g, '')
                .replace(/ - آخرین اخبار ورزشی/g, '')
                .replace(/ - Varzesh3/g, '')
                .replace(/ - Khabarvarzeshi/g, '')
                .replace(/ \| Varzesh 3/g, '')
                .replace(/[\|؛-].*$/, '')
                .trim()
                .replace(/\s+/g, ' ');
        }

        async function load() {
            try {
                const [feedRes, statsRes] = await Promise.all([
                    fetch('/api/debug/feed'),
                    fetch('/api/debug/stats')
                ]);
                if (!feedRes.ok || !statsRes.ok) throw new Error("API Error");
                const data = await feedRes.json();
                const s = await statsRes.json();

                // صف‌های انتشار
                const queuesHtml = !data.queues || Object.keys(data.queues).length === 0
                    ? '<div class="empty">همه صف‌ها خالی — عالی!</div>'
                    : '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;">' +
                    Object.entries(data.queues).map(([source, items]) => {
                        const count = (items || []).length;
                        const color = count > 15 ? '#f66' : count > 8 ? '#ff0' : '#0f9';
                        return `
                                      <div class="box" style="border-color:${color};">
                                          <h2 class="queues-title">${e(cleanSourceName(source))} <span style="color:#0f9;font-weight:bold;">${count} خبر</span></h2>
                                          <div class="scroll-box scroll-queues">
                                              ${count === 0 ? '<div class="empty">صف خالی</div>' :
                                `<table><tr><th>#</th><th>عنوان</th><th>زمان</th></tr>
                                                      ${items.map((item, i) => `
                                                          <tr>
                                                              <td class="num">${i + 1}</td>
                                                              <td title="${e(item.title)}">${e((item.title || "بدون عنوان").substring(0, 65))}...</td>
                                                              <td>${item.pubDate || ''}</td>
                                                          </tr>`).join('')}
                                                  </table>`
                            }
                                          </div>
                                      </div>`;
                    }).join('') + '</div>';

                // آخرین ارسال‌شده‌ها
                const publishedHtml = data.publishedItems?.length
                    ? `<div class="scroll-box scroll-published">
                                <table>
                                <tr>
                                <th>#</th>
                                <th>منبع</th>
                                <th>عنوان</th>
                                <th>زمان ارسال</th>
                                </tr>
                                    ${data.publishedItems.map((i, idx) => `
                                        <tr>
                                            <td class="num">${idx + 1}</td>
                                            <td><span class="status-sent">${e(cleanSourceName(i.source))}</span></td>
                                            <td title="${e(i.title)}">${e((i.title || "بدون عنوان").substring(0, 70))}...</td>
                                            <td>${i.sentAt || ''}</td>
                                        </tr>`).join('')}
                                </table>
                               </div>`
                    : '<div class="empty">هنوز خبری ارسال نشده</div>';

                // آخرین پردازش‌شده‌ها
                const recentHtml = data.recentProcessed?.length
                    ? `<div class="scroll-box scroll-logs">
            <table>
                <tr><th>#</th><th>منبع</th><th>عنوان</th><th>وضعیت</th><th>دلیل</th><th>زمان</th><th>لینک خبر</th></tr>
                ${data.recentProcessed.map((i, idx) => {
                        const source = cleanSourceName(i.source) || 'نامشخص';
                        const title = i.title || 'بدون عنوان';
                        const link = i.link || null;
                        const statusText = i.status || 'نامشخص';
                        const reasonText = i.reason || 'در حال بررسی';
                        let statusColor = 'status-rejected';
                        if (statusText === 'ارسال شد') statusColor = 'status-sent';
                        else if (statusText.includes('در صف')) statusColor = 'status-queued';
                        else if (statusText === 'قبول شده') statusColor = 'status-accepted';
                        const linkHtml = link
                            ? `<a href="${e(link)}" target="_blank" title="باز کردن خبر">Link</a>`
                            : '—';
                        return `
                        <tr>
                            <td class="num">${idx + 1}</td>
                            <td>${e(source)}</td>
                            <td title="${e(title)}">${e(title.substring(0, 55))}...</td>
                            <td class="${statusColor}">${statusText}</td>
                            <td style="font-size:11px;color:#ff9;" title="${e(reasonText)}">
                                ${e(reasonText.substring(0, 45))}${reasonText.length > 45 ? '...' : ''}
                            </td>
                            <td>${i.time || ''}</td>
                            <td class="link-cell">${linkHtml}</td>
                        </tr>`;
                    }).join('')}
            </table>
           </div>`
                    : '<div class="empty">هنوز خبری پردازش نشده</div>';

                mainEl.innerHTML = `
                            <h2 class="queues-title">صف‌های انتشار</h2>
                            ${queuesHtml}
                            <h2 class="published-title">آخرین ارسال‌شده‌ها</h2>
                            ${publishedHtml}
                            <h2 class="logs-title">آخرین پردازش‌شده‌ها</h2>
                            ${recentHtml}
                        `;

                const color = s.dashboardStatusColor === 'red' ? '#f66' : s.dashboardStatusColor === 'yellow' ? '#ff0' : '#0f9';
                statsEl.innerHTML = `
                            <div class="stat-box"><span class="stat-num" style="color:#0f9;">${nf(s.acceptedCount)}</span>قبول شده</div>
                            <div class="stat-box"><span class="stat-num" style="color:#f66;">${nf(s.rejectedCount)}</span>رد شده</div>
                            <div class="stat-box"><span class="stat-num" style="color:#0cf;">${nf(s.publishedCount)}</span>ارسال شده</div>
                            <div class="stat-box"><span class="stat-num" style="color:#ff0;">${nf(s.inQueueCount)}</span>در صف</div>
                            <div class="stat-box"><span class="stat-num" style="color:#aaa;">${nf(s.totalProcessed)}</span>کل پردازش</div>
                            <div class="stat-box"><span class="stat-num" style="color:${color};">${nf(s.acceptanceRate)}%</span>درصد قبولی</div>
                        `;

                startCountdown();
            } catch (err) {
                console.error("خطا:", err);
                mainEl.innerHTML = '<div class="empty" style="color:#f66;">خطا در ارتباط — دوباره تلاش می‌کنم...</div>';
                statsEl.innerHTML = '<div class="empty" style="color:#f66;">آمار در دسترس نیست</div>';
                startCountdown();
            }
        }
        load();
    </script>
</body>
</html>
